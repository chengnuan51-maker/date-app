name: Build AxisDay Installers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build ${{ matrix.os }} Installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Installer
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npx electron-builder --win --x64
          else
            npx electron-builder --mac
          fi
        shell: bash

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxisDay-${{ matrix.os }}-Installer
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: warn

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Capacitor Android APK
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "AxisDay" "com.axisday.planner" --web-dir www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AxisDay-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
